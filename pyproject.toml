[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nevso-preview"
version = "0.1.0"
description = "Python interface to the Nev + Nesso3 source-checkout workflow"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["jsonschema==4.23.0"]

[tool.setuptools]
packages = ["nevso"]
